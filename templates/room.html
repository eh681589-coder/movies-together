<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0c29">
  <title>Комната {{ code }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="room-page">
  <div class="room-wrap">

    <header class="room-header">
      <div class="room-title">
        <span class="dot"></span>
        <span>Комната</span>
        <button class="code-badge" id="codeBtn" title="Копировать код">{{ code }}</button>
      </div>
      <p class="hint">Нажми на код, чтобы скопировать</p>
    </header>

    <section class="player-section">
      <div class="player-area empty" id="playerArea">
        <div class="player-placeholder">
          <div class="icon">🎥</div>
          <p>Выбери фильм из списка ниже</p>
        </div>
      </div>
    </section>

    <section class="movies-section">
      <h3>🎬 Топ фильмов</h3>
      <div class="movies-grid" id="moviesGrid"></div>
    </section>

    <aside class="chat-section">
      <h3>💬 Чат</h3>
      <div id="chatBox"></div>
      <div class="chat-input-wrap">
        <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
        <button class="btn primary" id="sendBtn">→</button>
      </div>
    </aside>

  </div>

  <script>
    window.ROOM_CODE = "{{ code }}";
    window.MY_NAME = localStorage.getItem('myName') || 'Гость';
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='movies.js') }}"></script>
  <script src="{{ url_for('static', filename='room.js') }}"></script>
</body>
</html>
